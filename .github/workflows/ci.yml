name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    # Both release architectures must pass before a release is cut.
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --all-features --target ${{ matrix.target }}

      # The suite is hermetic: it uses a local mock CalDAV server and an
      # encrypted file keyring, so it needs neither network access nor D-Bus.
      - name: Test
        run: cargo test --all-features --target ${{ matrix.target }}

  secret-service-integration:
    # The hermetic suite pins the encrypted file keyring so it needs no desktop
    # session, which leaves the D-Bus backend unexecuted. This job runs it.
    name: Secret Service integration
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: secret-service-integration

      - name: Install a keyring and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring libglib2.0-bin

      # Runs inside `dbus-run-session` with a throwaway XDG_DATA_HOME, so it
      # touches no keyring outside the job.
      - name: Secret Service round trip
        run: ./scripts/integration/secret-service.sh

  release-plan:
    name: Check the release plan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Verifies a pinned SHA-256 digest rather than piping a remote installer
      # into a shell.
      - name: Install dist
        run: ./scripts/install-dist.sh

      # release.yml is generated by dist and then hardened by
      # scripts/harden-release-workflow.py, because cargo-dist 0.32 cannot
      # express read-only default permissions, per-job token removal, or a
      # digest-verified install. This step fails if either half has drifted.
      - name: Verify the generated and hardened release workflow is current
        run: |
          dist generate
          ./scripts/harden-release-workflow.py
          git diff --exit-code

  workflows:
    name: Lint workflows and scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # actionlint runs without its shellcheck integration: the `run:` blocks in
      # release.yml come from the cargo-dist template and carry upstream style
      # nits we deliberately do not patch. Our own scripts are checked below.
      - name: Install actionlint
        run: ./scripts/install-actionlint.sh

      - name: actionlint
        run: .tools/actionlint -no-color -oneline

      - name: shellcheck our scripts
        run: shellcheck scripts/*.sh scripts/integration/*.sh

      - name: Check the hardening script is self-consistent
        run: ./scripts/harden-release-workflow.py --check
